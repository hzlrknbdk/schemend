name: Docker build ownership

on:
  workflow_dispatch: {}
  push:
    paths:
      - "packages/core/src/docker-exec.ts"
      - "packages/core/src/check.ts"
      - "packages/lang-typescript/docker/Dockerfile"
  pull_request:
    paths:
      - "packages/core/src/docker-exec.ts"
      - "packages/core/src/check.ts"
      - "packages/lang-typescript/docker/Dockerfile"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Full clone (not --depth 1): schemend check's default baseRef is HEAD~1, which a
      # shallow clone doesn't have.
      - name: Clone schemend-demo
        run: git clone https://github.com/hzlrknbdk/schemend-demo.git demo

      - name: Install checkout-web against the current schema
        working-directory: demo/apps/checkout-web
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:api
          pnpm exec next typegen

      - name: Apply a non-breaking schema change
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'demo/services/orders/openapi.json';
            const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
            schema.components.schemas.Order.properties.trackingNumber = { type: 'string', title: 'Trackingnumber' };
            fs.writeFileSync(path, JSON.stringify(schema, null, 2));
          "

      - name: Write schemend.config.ts
        working-directory: demo/apps/checkout-web
        run: |
          cat > schemend.config.ts <<'EOF'
          export default {
            apis: [
              { name: "orders", schema: "../../services/orders/openapi.json", usedIn: ["src/lib"] },
            ],
            test: "pnpm typecheck && pnpm test",
            platform: "github",
            budgetUsd: 1,
          };
          EOF

      # Non-breaking: affected.length is 0, so this never reaches the fix agent - no
      # ANTHROPIC_API_KEY is set anywhere in this job, by design.
      - name: Run schemend check
        working-directory: demo/apps/checkout-web
        run: node "$GITHUB_WORKSPACE/packages/cli/dist/index.mjs" check --record-events events.ndjson

      # The check step above can exit 0 without ever reaching Docker (e.g. a schema it
      # can't read is reported as a non-fatal service result, not a crash) - a passing
      # exit code alone doesn't prove baseline ran. Read the recorded events instead.
      - name: Verify schemend check reached a passed baseline step
        working-directory: demo/apps/checkout-web
        run: |
          if ! jq -e 'select(.type == "step-finished" and .step == "baseline" and .status == "passed")' events.ndjson > /dev/null; then
            echo "::error::schemend check never reached a passed baseline step - see events.ndjson"
            exit 1
          fi

      - name: Verify build output is not root-owned
        working-directory: demo/apps/checkout-web
        run: |
          expected="$(id -u)"
          actual="$(stat -c '%u' .next/types)"
          echo "expected uid=$expected, .next/types uid=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::build output inside the bind-mounted project is root-owned"
            exit 1
          fi

      - name: Verify the dependency volume is not root-owned
        run: |
          volume="$(docker volume ls --format '{{.Name}}' --filter 'name=schemend-deps-' | head -1)"
          if [ -z "$volume" ]; then
            echo "::error::no schemend-deps-* volume found after schemend check ran"
            exit 1
          fi
          image="$(docker images --format '{{.Repository}}:{{.Tag}}' --filter 'reference=schemend-lang-typescript:*' | head -1)"
          if [ -z "$image" ]; then
            echo "::error::no schemend-lang-typescript:* image found after schemend check ran"
            exit 1
          fi
          expected="$(id -u)"
          actual="$(docker run --rm -v "$volume:/nm" "$image" stat -c '%u' /nm/.bin)"
          echo "expected uid=$expected, volume's node_modules/.bin uid=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dependency volume is root-owned, not the invoking user"
            exit 1
          fi
